# Zero-install update automation (works without any app installation):
#   - github-actions: bumps the Kairos Factory Action tag and the std actions
#   - docker:         bumps the kairos-init FROM pin in images/Dockerfile
#
# Dependabot cannot follow ARG-based pins, so these stay manual or Renovate-managed:
#   - ARG BASE_IMAGE (ubuntu) and ARG K3S_VERSION in images/Dockerfile
#   - auroraboot_version inputs in the workflows
# renovate.json covers all of them — if the Renovate app gets installed on the
# org, delete this file to avoid duplicate PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /images
    schedule:
      interval: weekly
