# PR / main validation: run the full Kairos Factory pipeline (image build +
# ISO generation + CVE report) for both architectures, without publishing
# anything. This is the gate that keeps kairos-init / factory / openSUSE bumps
# from ever landing broken: if this is green, a release tag will build.
name: build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The factory's reusable workflow declares these on its job; the caller must
# grant them. contents:write is only exercised by its release step (off here).
permissions:
  contents: write
  actions: read
  security-events: write
  id-token: write

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    name: sheepos-${{ matrix.arch }}
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@v1.1.1
    with:
      dockerfile_path: images/Dockerfile
      # Keep in sync with the ARG BASE_IMAGE default in images/Dockerfile
      # (that default is what release builds use).
      # renovate: docker-image
      base_image: opensuse/leap:16.0
      arch: ${{ matrix.arch }}
      model: generic
      version: auto # git describe — fine for validation builds
      iso: true
      grype: true
      security_scan_mode: report-only
      summary_artifacts: true
      # renovate: datasource=github-releases depName=kairos-io/AuroraBoot
      auroraboot_version: v0.22.0
      custom_job_name_format: validate-$ARCH
