# PR / main validation: run the full Kairos Factory pipeline (image build +
# ISO generation + CVE report) for both architectures, without publishing
# anything. This is the gate that keeps kairos-init / factory / Ubuntu bumps
# from ever landing broken: if this is green, a release tag will build.
name: build

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# The factory's reusable workflow declares these on its job; the caller must
# grant them. contents:write is only exercised by its release step (off here).
permissions:
  contents: write
  actions: read
  security-events: write
  id-token: write

jobs:
  # The factory's reusable workflow always injects its base_image input as
  # BASE_IMAGE, so the ARG default in images/Dockerfile — the value the
  # release oci job actually builds with — would never be exercised by this
  # gate if we passed a second literal here. Read the ARG instead: one source
  # of truth, and a green PR really validates the bytes a release would ship.
  base-image:
    name: base image pin
    runs-on: ubuntu-24.04
    outputs:
      base_image: ${{ steps.arg.outputs.base_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Read ARG BASE_IMAGE from images/Dockerfile
        id: arg
        run: |
          base="$(sed -n 's/^ARG BASE_IMAGE=//p' images/Dockerfile)"
          test -n "$base"
          echo "base_image=$base" >> "$GITHUB_OUTPUT"

  validate:
    needs: base-image
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    name: sheepos-${{ matrix.arch }}
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@v1.1.1
    with:
      dockerfile_path: images/Dockerfile
      base_image: ${{ needs.base-image.outputs.base_image }}
      arch: ${{ matrix.arch }}
      model: generic
      version: auto # git describe — fine for validation builds
      iso: true
      grype: true
      security_scan_mode: report-only
      summary_artifacts: true
      # renovate: datasource=docker depName=quay.io/kairos/auroraboot
      auroraboot_version: v0.21.2
      custom_job_name_format: validate
